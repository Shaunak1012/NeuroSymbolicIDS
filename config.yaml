# NeuroSymbolic-IDS — central experiment configuration
# All protocol parameters live here so experiments are reproducible and one-line changeable.
# Consumed via scripts/config.py (config.get()).

seed: 42

# ============================================================
# PROTOCOL: paper-aligned split (Bizzarri et al.)
#   9 known classes (benign + 8 attacks) -> stratified 80/10/10 into train/val/test
#   6 rare classes  -> zero-day, appended to TEST only (never trained)
#   benign under-sampled to ~1:1 vs total known-attack count
# ============================================================
protocol:
  name: paper                 # "paper" (this split) | "temporal" (secondary hard-mode)
  val_frac: 0.10
  test_frac: 0.10
  benign_ratio: 1.0           # benign : known-attack count (1.0 = balanced, paper-faithful)
  # Apply sign(x)*log1p(|x|) before scaling.
  #
  # JUSTIFIED ON THE HEADLINE METRIC (C4 CLOSED 2026-08-10, scripts/c4_transform_ab.sh).
  #   log1p  macro zero-day PR-AUC  0.6299 +/- 0.0031   (seeds 42/43/44, determinism on)
  #   raw    macro zero-day PR-AUC  0.1606 +/- 0.0039
  #   delta +0.4693, ranges do not overlap, Welch t=163 p<1e-6 -- 15x the ~0.032 uncertainty
  #   that any absolute number carries. Per family: XSS 5.7x, Web BF 3.1x.
  # log1p wins, decisively, and now for the right reason. Cite THESE numbers, not 0.980.
  #
  # Superseded justification, kept so the error is not re-made: the Phase 0.3 A/B cited
  # "signed-log1p beat raw 0.980 vs 0.965 PR-AUC". That 0.980 is the OVERALL BINARY metric,
  # which is (a) inflated by the 17% train/test duplicate overlap and (b) the metric
  # metrics.py explicitly forbids as an optimisation target. The right answer was reached
  # on the wrong evidence -- which is why it had to be re-run rather than assumed.
  feature_transform: log1p

# ============================================================
# PHASE 6: CSE-CIC-IDS2018 zero-day split.
#
# OPTION A CHOSEN 2026-09-09 -- mirror the 2017 FAMILY NAMES, and deliberately
# accept that Bot is no longer rare (286,191 flows vs 1,966 in 2017).
#
# WHY A AND NOT "MATCH ON RARITY". The mechanism this replication tests is about
# FEATURE-BASIS OVERLAP, not scarcity: "a novel class is reachable exactly to the
# extent its signature overlaps the basis the model was trained on" (Bot: 0/8
# overlap, cross-seed rho = -0.090). Rarity appears nowhere in that claim -- it
# was incidental to 2017's Bot.
#
# So testing on an ABUNDANT novel family is the cleaner experiment: it removes
# scarcity as a confound and gives the overlap and rank-correlation analyses far
# more power than 1,966 flows ever did. The prediction is sharp and falsifiable:
# if the mechanism holds, 2018's Bot is STILL unreachable despite being the 5th
# largest attack class, because abundance in TEST cannot help a model that never
# trained on it. If it turns out reachable, that is a major finding about our own
# 2017 result -- it would mean scarcity was doing work we attributed to overlap.
#
# 🔴 THE ARGUMENT AGAINST OPTION B, which was the earlier lean and is now
# rejected: 2018's rare families are rare PARTLY BECAUSE OF THE TRUNCATION WE
# JUST FOUND. Friday-23-02 (the web-attack day) is cut at 09:04, 46 minutes in.
# Building the headline replication on classes whose size is an artefact of a
# spreadsheet row limit would invite exactly the objection the audit exists to
# raise.
#
# ⚠️ 2018 has no Heartbleed, so this is 5 zero-day families, not 6.
# ⚠️ Powered subset expected: Bot (286,191) and Infilteration (161,934); Web BF
#    (611) sits just under 2017's smallest kept family (XSS, 652) and is
#    marginal; XSS (230) and SQL Injection (87) are underpowered and must not be
#    reported to 4 dp -- the same rule metrics.py enforces for 2017.
# ============================================================
zero_day_classes_2018:
  - Bot
  - Infilteration
  - Brute Force -Web
  - Brute Force -XSS
  - SQL Injection

# 8 known attacks + BENIGN = 9 known classes (kept in train/val/test)
known_attacks:
  - DDoS
  - DoS GoldenEye
  - DoS Hulk
  - DoS Slowhttptest
  - DoS slowloris
  - FTP-Patator
  - PortScan
  - SSH-Patator

# 6 zero-day classes (test only) — the rare (<1%) families
zero_day_classes:
  - Bot
  - Heartbleed
  - Infiltration
  - Web Attack Brute Force
  - Web Attack XSS
  - Web Attack Sql Injection

# ============================================================
# DATA NOTES
# ============================================================
data:
  variant: GeneratedLabelledFlows  # full CIC-IDS2017 flows WITH Flow ID/IP/Port/Protocol/Timestamp
  raw_dir: data/raw_csv_full        # 85-col CSVs; preprocess.py reads here
  has_ip_timestamp: true            # -> RepeatedConnections & source-level response replay ENABLED
  n_features: 68                    # identical to ML-CVE variant (Destination Port kept as feature)
  meta_cols: [Flow ID, Source IP, Source Port, Destination IP, Destination Port, Protocol, Timestamp]

paths:
  paper_subdir: paper            # data/processed/paper/  and  models/paper/ etc.
